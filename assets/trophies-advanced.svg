<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300"><stop stop-color="#020617"/><stop offset=".5" stop-color="#071526"/><stop offset="1" stop-color="#020617"/></linearGradient>
