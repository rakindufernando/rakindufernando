<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#071A2E"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop stop-color="#00BFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00BFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="textGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00BFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="42 42" dur="7s" repeatCount="indefinite"/>
  </rect>

  <circle cx="170" cy="70" r="170" fill="url(#glow1)" filter="url(#blur)">
    <animate attributeName="cx" values="130;270;130" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="145;205;145" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="245" r="190" fill="url(#glow2)" filter="url(#blur)">
    <animate attributeName="cx" values="1040;900;1040" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="235;175;235" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.9">
    <circle cx="100" cy="92" r="3" fill="#67E8F9"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="70" r="4" fill="#A78BFA"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="270" r="3" fill="#38BDF8"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="255" r="3" fill="#C4B5FD"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="112" text-anchor="middle" fill="#E6F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="4" filter="url(#textGlow)">RAKINDU FERNANDO</text>
  <text x="600" y="160" text-anchor="middle" fill="#67E8F9" font-family="Consolas, monospace" font-size="20" letter-spacing="2">SOFTWARE ENGINEERING • AI • CREATIVE TECHNOLOGY</text>

  <rect x="350" y="195" width="500" height="2" rx="1" fill="url(#line)">
    <animate attributeName="x" values="350;410;350" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="width" values="500;380;500" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Consolas, monospace" font-size="16" fill="#CBD5E1">
    <text x="600" y="235" text-anchor="middle">BUILDING INTELLIGENT SOFTWARE AND VISUAL EXPERIENCES</text>
    <text x="600" y="268" text-anchor="middle" fill="#00BFFF">&lt; code • design • learn • improve /&gt;
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="#00BFFF" stroke-opacity="0.25" stroke-width="2"/>
</svg>
